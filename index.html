<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>FEBC &mdash; Board papers</title>
<style>
  :root { color-scheme: light; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #fbfaf7; color: #1d2024;
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  form { width: min(92vw, 25rem); padding: 26px 24px 24px; background: #fff; border: 1px solid #ddd8cf; border-radius: 10px; }
  h1 { font-family: Georgia, "Times New Roman", serif; font-size: 1.3rem; margin: 0 0 4px; }
  p { margin: 0 0 16px; color: #5b6168; font-size: 0.92rem; }
  label { display: block; font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.07em; color: #5b6168; font-weight: 600; }
  .pw { position: relative; margin: 5px 0 12px; }
  input { display: block; width: 100%; box-sizing: border-box; padding: 9px 40px 9px 11px; font: inherit;
    border: 1px solid #ddd8cf; border-radius: 6px; background: #fff; }
  .eye { position: absolute; top: 50%; right: 6px; transform: translateY(-50%);
    width: 30px; height: 30px; padding: 0; display: grid; place-items: center;
    border: 0; border-radius: 6px; background: none; color: #5b6168; cursor: pointer; }
  .eye:hover { background: #f2efe9; }
  .eye svg { width: 18px; height: 18px; display: block; }
  .eye .off { display: none; }
  .eye[aria-pressed="true"] .on { display: none; }
  .eye[aria-pressed="true"] .off { display: block; }
  button { font: inherit; padding: 9px 16px; border: 0; border-radius: 6px; background: #1d2024; color: #fff; cursor: pointer; }
  .no { color: #a1341f; font-size: 0.88rem; min-height: 1.3em; margin: 10px 0 0; }
</style>
</head>
<body>
<form id="gate" autocomplete="off">
  <h1>Far Eastern Bible College</h1>
  <p>Board papers for 26 November 2026. Enter the password you were given.</p>
  <label for="pw">Password</label>
  <div class="pw">
    <input id="pw" type="password" autocomplete="current-password" autofocus>
    <button type="button" class="eye" id="eye" aria-pressed="false" aria-label="Show password" title="Show password">
      <svg class="on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
      <svg class="off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.7 5.1A10.6 10.6 0 0 1 12 5c6.4 0 10 7 10 7a18.5 18.5 0 0 1-2.4 3.4M6.6 6.6A18.4 18.4 0 0 0 2 12s3.6 7 10 7a10.3 10.3 0 0 0 4.3-.9"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/><path d="m2 2 20 20"/></svg>
    </button>
  </div>
  <button type="submit">Open</button>
  <p class="no" id="no"></p>
</form>
<script>
  const eye = document.getElementById('eye');
  eye.addEventListener('click', () => {
    const field = document.getElementById('pw');
    const shown = eye.getAttribute('aria-pressed') === 'true';
    eye.setAttribute('aria-pressed', String(!shown));
    const label = shown ? 'Show password' : 'Hide password';
    eye.setAttribute('aria-label', label);
    eye.title = label;
    field.type = shown ? 'password' : 'text';
    field.focus();
  });
  const DATA = { salt: "Wvv3sOAMKruoQ+Emdduq7A==", iv: "KMWeJj6pXIOgdrtG", file: "papers.bin" };
  const bytes = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
  document.getElementById('gate').addEventListener('submit', async (e) => {
    e.preventDefault();
    const no = document.getElementById('no');
    no.textContent = 'Opening\u2026 this takes a few seconds';
    try {
      const enc = new TextEncoder();
      const base = await crypto.subtle.importKey('raw', enc.encode(document.getElementById('pw').value), 'PBKDF2', false, ['deriveKey']);
      const key = await crypto.subtle.deriveKey(
        { name: 'PBKDF2', salt: bytes(DATA.salt), iterations: 250000, hash: 'SHA-256' },
        base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
      const cipher = await fetch(DATA.file).then((r) => r.arrayBuffer());
      const out = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes(DATA.iv) }, key, cipher);
      const html = new TextDecoder().decode(out);
      document.open(); document.write(html); document.close();
    } catch {
      no.textContent = 'That password does not open it.';
    }
  });
</script>
</body>
</html>
